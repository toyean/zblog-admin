	<div class="main">
		<div class="head">
			<div class="menuico"><span></span><span></span><span></span></div>
			<a href="" target="_balnk" class="backhome">浏览网站</a>
			<a href="javascript:;" class="theme light"></a>
			<div class="user">
				<div class="userlink"><span class="userimg"><img src="../style/images/userimg.jpg" alt=""></span><span class="username"><strong>拓源主题</strong><em>管理员</em></span></div>
				<div class="usermenu">
					<ul>
						<li><a href="" class="ico-set">系统设置</a></li>
						<li><a href="" class="ico-user">账户设置</a></li>
						<li><a href="" class="ico-logout">退出登录</a></li>
					</ul>
				</div>
			</div>
		</div>
		<div class="content">
			<div class="title">
				<h2><span>创作</span></h2>
			</div>
			<div class="write">
				<form action="#" name="edit" id="edit" method="post">
					<div class="writecon">
						<p>
							<label for="">标题</label>
							<input type="text" name="Title" maxlength="100" placeholder="标题" value="未命名">
						</p>
						<div class="p">
							<label for="editor_content">正文</label>
							<textarea name="Content" id="editor_content"></textarea>
							<div id="aiEditor" style="width:100%; height:400px;"></div>
							<link rel="stylesheet" href="../plugin/aieditor/style.css">
							<script type="module" src="../plugin/aieditor/aieditor.js"></script>
							<strong class="createintro">* 在正文插入首条分隔符，则分隔符以上的内容将作为摘要。您也可以 <a href="">[自动生成摘要]</a></strong>
						</div>
						<div class="half">
							<p>
								<label for="edtAlias">别名</label>
								<input type="text" name="Alias" id="edtAlias" maxlength="250">
							</p>
							<p>
								<label for="edtTag">标签</label>
								<input type="text" name="Tag" id="edtTag" placeholder="多个标签使用逗号分隔">
							</p>
						</div>
					</div>
					<div class="writeinfo">
						<p>
							<label for="cmbCateID">分类</label>
							<select class="edit" size="1" name="CateID" id="cmbCateID">
								<option value="1">未分类</option>
							</select>
						</p>
						<p>
							<label for="cmbPostStatus">状态</label>
							<select class="edit" size="1" name="Status" id="cmbPostStatus" onchange="cmbPostStatus.value=this.options[this.selectedIndex].value">
								<option value="0" selected="selected">公开</option>
								<option value="1">草稿</option>
								<option value="2">审核</option>
							</select>
						</p>
						<p>
							<label for="cmbTemplate">模板</label>
							<select class="edit" size="1" name="Template" id="cmbTemplate" onchange="cmbTemplate.value=this.options[this.selectedIndex].value">
								<option value="">无</option>
								<option value="single" selected="selected">[当前模板] single (文章页单页)</option>
							</select>
						</p>
						<p>
							<label for="cmbUser">作者</label>
							<select class="edit" size="1" name="AuthorID" id="cmbUser" onchange="cmbUser.value=this.options[this.selectedIndex].value">
								<option value="1" selected="selected">toyean</option>
							</select>
						</p>
						<p>
							<label for="edtDateTime">日期</label>
							<input type="text" name="PostTime" id="edtDateTime" class="hasDatepicker">
						</p>
						<p>
							<label for="edtIstopType">置顶</label>
							<select size="1" name="IsTop" id="edtIstopType" class="off-hide">
								<option value="0" selected="selected">无</option>
								<option value="2">首页</option>
								<option value="1">全局</option>
								<option value="4">分类</option>
							</select>
						</p>
						<p class="both">
							<label for="edtIslock">禁止评论</label>
							<input type="text" name="IsLock" id="edtIslock" value="0" class="checkbox">
						</p>
					</div>
				</form>
			</div>
		</div>
	</div>
</div>
</body>
